name: pcp-rust CI

# Two crates with very different states, and this workflow is explicit
# about which is which:
#
#   pcp-core  — builds clean, 43 unit tests pass. BLOCKING.
#   pcp-ledger — does NOT compile. 19 pre-existing type errors in the
#                 CRDT layer. NON-BLOCKING, and commented as such.
#
# The ledger is deliberately not hidden behind `|| true`. It is a
# declared, enumerated failure. `CHANGELOG.md` lists all 19 errors by
# category, and `CONTRIBUTING.md` invites exactly this work. When the
# crate compiles, flip `continue-on-error` to blocking in the same PR.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ===========================================================================
  # pcp-core — BLOCKING
  # ===========================================================================
  core-build:
    name: pcp-core / build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pcp-core -> target
          key: pcp-core

      - name: Build
        working-directory: pcp-core
        run: cargo build --release

      - name: Test
        working-directory: pcp-core
        run: cargo test

      # A plain `cargo build` must not require a Python interpreter.
      # This is the regression test for the pyo3 misconfiguration: pyo3 is
      # optional behind the `python` feature, so the default build has no
      # `extension-module` linker requirement. If someone re-adds pyo3 as
      # an unconditional dependency, this job starts failing on a runner
      # with no CPython headers — which is exactly the point.
      - name: Confirm no Python interpreter is required for the default build
        working-directory: pcp-core
        env:
          PYO3_PYTHON: ""
        run: |
          if grep -qE '^\s*pyo3\s*=' Cargo.toml; then
            echo "::error::pyo3 is a non-optional dependency. It must be"
            echo "::error::optional and gated behind the 'python' feature."
            exit 1
          fi
          grep -q 'python = \[' Cargo.toml \
            || { echo "::error::the 'python' feature is missing"; exit 1; }
          echo "pyo3 is correctly gated behind an optional feature"

  # ===========================================================================
  # pcp-ledger — NON-BLOCKING, known broken
  # ===========================================================================
  ledger-build:
    name: pcp-ledger (known broken — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ledger -> target
          key: pcp-ledger

      - name: Build
        working-directory: ledger
        run: cargo build

      - name: Test
        working-directory: ledger
        run: cargo test

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [core-build, ledger-build]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## pcp-rust CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Blocking? | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| core-build   | **yes** | ${{ needs.core-build.result }}   |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ledger-build | no      | ${{ needs.ledger-build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ledger-build\` is expected to fail. \`pcp-ledger\` has 19" >> "$GITHUB_STEP_SUMMARY"
          echo "open type errors, enumerated in \`CHANGELOG.md\`. A pass here" >> "$GITHUB_STEP_SUMMARY"
          echo "is good news: please make the build blocking in the same PR." >> "$GITHUB_STEP_SUMMARY"
