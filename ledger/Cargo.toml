[package]
name = "physicalcontextprotocol-ledger"
version = "1.0.0"
edition = "2021"
description = "PCP Distributed Digital Twin Ledger with 4D CRDT"
authors = ["Sandeep THummala <physicalcontextprotocol@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/physicalcontextprotocol/pmcp-rust"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
bytes = "1.5"

[dependencies.redis]
version = "0.25"
# `scripting` is not a feature of redis 0.25 — the Lua-scripting feature is
# named `script`. Cargo refused to resolve the dependency at all because of
# the typo, so `cargo build`/`cargo test` failed before compiling anything.
features = ["tokio-comp", "connection-manager", "script"]

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]

[dependencies.etcd-client]
version = "0.13"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "physicalcontextprotocol_ledger"
path = "src/lib.rs"

[[bin]]
name = "pcp-ledger"
path = "src/main.rs"